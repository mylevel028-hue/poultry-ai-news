name: Poultry Market AI Engine

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-ai-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Gemini Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/cloud_accumulator.py

      - name: Commit Updated Analysis
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f latest_news.json ]; then
            echo '{"status": "pending", "content": "Initializing initial report..."}' > latest_news.json
          fi
          git add latest_news.json
          git commit -m "Auto-update hourly poultry report" || exit 0
          git push
