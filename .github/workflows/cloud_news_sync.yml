- name: Commit Updated Analysis
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create placeholder if script didn't generate file due to an API error
          if [ ! -f latest_news.json ]; then
            echo '{"status": "pending", "content": "Initializing initial report..."}' > latest_news.json
          fi
          
          git add latest_news.json
          git commit -m "Auto-update hourly poultry report" || exit 0
          git push
